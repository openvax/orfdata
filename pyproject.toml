[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orfdata"
dynamic = ["version"]
description = "Reference open reading frames and experimental translation evidence on annotated transcripts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{name = "OpenVax"}]
dependencies = []

[project.optional-dependencies]
pyensembl = ["pyensembl>=2.27.2"]
build-data = ["openpyxl>=3.1"]
data = ["datacache>=1.25.1,<2"]
columnar = ["pyarrow>=14"]
dev = ["pytest", "ruff", "build", "twine", "openpyxl>=3.1", "pyensembl>=2.27.2", "datacache>=1.25.1,<2"]

[project.scripts]
orfdata = "orfdata.cli:run"

[tool.setuptools.dynamic]
version = {attr = "orfdata.version.__version__"}

[tool.setuptools.packages.find]
include = ["orfdata*"]

[tool.setuptools.package-data]
orfdata = ["data/uorf-evidence/*", "data/orf-evidence/*", "data/datasets.json", "data/catalogs.json"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
