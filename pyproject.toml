[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orfdata"
dynamic = ["version"]
description = "Reference proteomes with evidence-backed noncanonical ORFs on PyEnsembl genomes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "OpenVax"}]
dependencies = ["datacache>=1.25.1,<2", "pandas>=3,<4", "pyyaml>=6,<7"]

[project.optional-dependencies]
pyensembl = ["pyensembl>=2.27.2"]
build-data = ["openpyxl>=3.1"]
# Viral support needs nothing beyond the base install; the extra stays valid for
# existing instructions, and the viral *data* is acquired with
# 'orfdata download viral'.
viral = []
data = ["datacache>=1.25.1,<2"]
columnar = ["pyarrow>=14"]
# gb-io is a development dependency only: tests compare ORFdata's GenBank
# reader with an independent implementation of the format.
dev = ["pytest", "ruff", "build", "twine", "openpyxl>=3.1", "pyensembl>=2.27.2", "datacache>=1.25.1,<2", "gb-io>=0.4,<0.5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
orfdata = "orfdata.cli:run"

[tool.setuptools.dynamic]
version = {attr = "orfdata.version.__version__"}

[tool.setuptools.packages.find]
include = ["orfdata*"]

[tool.setuptools.package-data]
orfdata = ["data/uorf-evidence/*", "data/orf-evidence/*", "data/ires/*", "data/viral/*", "data/datasets.json", "data/catalogs.json", "data/chains.json", "data/genomes.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
