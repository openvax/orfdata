[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orfdata"
dynamic = ["version"]
description = "Reference proteomes with evidence-backed noncanonical ORFs on PyEnsembl genomes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "OpenVax"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # Tab completion for the orfdata command.
    "argcomplete>=3",
    "datacache>=1.29.3,<2",
    "pandas>=3,<4",
    "pyyaml>=6,<7",
    "pyensembl>=2.32.3",
    "openpyxl>=3.1,<4",
    "pyarrow>=14",
    "pyahocorasick>=2.3,<3",
]

[project.optional-dependencies]
# APSW's custom VFS is needed only for explicit vendor-database extraction.
# Downloaded dataset queries and rebuilds from normalized sources do not use it.
canine-extraction = ["apsw>=3.54,<4"]
# gb-io is a development dependency only: tests compare ORFdata's GenBank
# reader with an independent implementation of the format.
# Biotite is used only by the experimental dog ncORF search (not part of the
# package) and its tests; Python 3.11 resolves to Biotite 1.6, and Biotite 2
# requires Python >=3.12. Biopython is the independent test oracle for that
# search's Biotite alignments (#131) and translates ORFs in
# tools/verify_riborf_native.py.
dev = [
    "pytest", "ruff", "build", "twine", "gb-io>=0.4,<0.5", "apsw>=3.54,<4",
    "biotite>=1.6,<3", "biopython>=1.88,<2",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
orfdata = "orfdata.cli:run"

[tool.setuptools.dynamic]
version = {attr = "orfdata.version.__version__"}

[tool.setuptools.packages.find]
include = ["orfdata*"]

[tool.setuptools.package-data]
orfdata = ["data/uorf-evidence/*", "data/orf-evidence/*", "data/ires/*", "data/viral/*", "data/datasets.json", "data/catalogs.json", "data/chains.json", "data/genomes.json", "data/source_records.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: needs the pinned real source records, downloaded from GitHub (run with --real-data)"]
