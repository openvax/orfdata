[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orfdata"
dynamic = ["version"]
description = "Reference proteomes with evidence-backed noncanonical ORFs on PyEnsembl genomes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "OpenVax"}]
dependencies = [
    "datacache>=1.29.3,<2",
    "pandas>=3,<4",
    "pyyaml>=6,<7",
    "pyensembl>=2.32.3",
    "openpyxl>=3.1,<4",
    "pyarrow>=14",
    # Python 3.11 resolves to 1.6; current Biotite 2 requires Python >=3.12.
    "biotite>=1.6,<3",
    "pyahocorasick>=2.3,<3",
]

[project.optional-dependencies]
# APSW's custom VFS is needed only for explicit vendor-database extraction.
# Downloaded dataset queries and rebuilds from normalized sources do not use it.
canine-extraction = ["apsw>=3.54,<4"]
# gb-io is a development dependency only: tests compare ORFdata's GenBank
# reader with an independent implementation of the format.
# Biopython independently checks the Biotite migration's scores and tie order.
dev = ["pytest", "ruff", "build", "twine", "gb-io>=0.4,<0.5", "apsw>=3.54,<4", "biopython>=1.88,<2"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
orfdata = "orfdata.cli:run"

[tool.setuptools.dynamic]
version = {attr = "orfdata.version.__version__"}

[tool.setuptools.packages.find]
include = ["orfdata*"]

[tool.setuptools.package-data]
orfdata = ["data/uorf-evidence/*", "data/orf-evidence/*", "data/ires/*", "data/viral/*", "data/datasets.json", "data/catalogs.json", "data/chains.json", "data/genomes.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
