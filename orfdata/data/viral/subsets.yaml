schema: orfdata.viral_subsets.v1
subsets:
  cancer-integrated-driver:
    title: Cancer viruses that integrate and directly drive a tumour
    description: >-
      Viruses with host-genome integration and a direct tumour-cell driving role
      in a relevant cancer setting.
    abbreviations:
      - HBV
      - HPV16
      - HPV18
      - HPV31
      - HPV33
      - HPV35
      - HPV39
      - HPV45
      - HPV51
      - HPV52
      - HPV56
      - HPV58
      - HPV59
      - HTLV-1
      - MCV
    source_urls:
      - https://publications.iarc.who.int/119
      - https://pubmed.ncbi.nlm.nih.gov/38624210/
      - https://pubmed.ncbi.nlm.nih.gov/33563643/
      - https://pubmed.ncbi.nlm.nih.gov/6328324/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC2740911/
    limitations: >-
      Integration and direct carcinogenicity are tumour-specific observations;
      this selection does not show that a particular tumour is virus-dependent.
  cancer-causing:
    title: Cancer-causing viral agents
    description: >-
      GDC references for viral agents classified by IARC as carcinogenic to
      humans (Group 1).
    abbreviations:
      - EBV (HHV-4)
      - HBV
      - HCV-1
      - HCV-2
      - HIV-1
      - HHV-8, KSHV
      - HTLV-1
      - MCV
      - HPV16
      - HPV18
      - HPV31
      - HPV33
      - HPV35
      - HPV39
      - HPV45
      - HPV51
      - HPV52
      - HPV56
      - HPV58
      - HPV59
    source_urls:
      - https://monographs.iarc.who.int/agents-classified-by-the-iarc/
    limitations: >-
      This is an IARC evidence classification. It does not establish that a
      viral read in an individual tumour is causal or targetable.
  cancer-associated:
    title: Cancer-associated viral agents
    description: >-
      GDC references for viral agents classified by IARC in Groups 1, 2A or
      2B.
    abbreviations:
      - CMV ( HHV-5)
      - EBV (HHV-4)
      - HBV
      - HCV-1
      - HCV-2
      - HIV-1
      - HIV-2
      - HHV-8, KSHV
      - HTLV-1
      - MCV
      - HPV16
      - HPV18
      - HPV26
      - HPV31
      - HPV33
      - HPV35
      - HPV39
      - HPV45
      - HPV51
      - HPV52
      - HPV53
      - HPV56
      - HPV58
      - HPV59
      - HPV66
      - HPV68
      - HPV69
      - HPV73
      - HPV82
      - HPV5
      - HPV8
      - HPV30
      - HPV34
      - HPV67
      - HPV70
      - HPV85
      - HPV97
    source_urls:
      - https://monographs.iarc.who.int/agents-classified-by-the-iarc/
    limitations: >-
      This contains cancer-causing as a subset. References outside it have not
      been classified here as lacking a cancer connection.
aliases:
  integrated-direct-driver: cancer-integrated-driver
