name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ./lint.sh
      - run: ./test.sh
        env:
          ORFDATA_CLI_AUDIT_DIR: ${{ runner.temp }}/orfdata-cli-audit
      - name: Save command help and output audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-audit-python-${{ matrix.python }}
          path: ${{ runner.temp }}/orfdata-cli-audit/
      - name: Build and verify the extracted source distribution
        run: |
          python -m build
          python -m twine check dist/*
          mkdir "$RUNNER_TEMP/orfdata-sdist"
          tar -xzf dist/orfdata-*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/orfdata-sdist"
          cd "$RUNNER_TEMP/orfdata-sdist"
          ./lint.sh
          ./test.sh
